name: Build unsigned Apple TV IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-tvos-ipa.yml
      - scripts/**
      - patches/**
      - versions.env

permissions:
  contents: read

jobs:
  build:
    name: Barebones mGBA Multi
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out build kit
        uses: actions/checkout@v7

      - name: Verify pinned build kit
        run: |
          shasum -a 256 -c MANIFEST.sha256
          bash -n scripts/build-unsigned-ipa.sh scripts/validate-ipa.sh

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          cmake --version

      - name: Build and validate unsigned IPA
        run: ./scripts/build-unsigned-ipa.sh
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: RetroArchTV-mGBA-Multi-unsigned
          path: |
            dist/*.ipa
            dist/SHA256SUMS.txt
            dist/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
