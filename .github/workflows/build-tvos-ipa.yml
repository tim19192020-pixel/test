name: Build unsigned Apple TV IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: RetroArchTV plus mGBA Multi
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out build kit
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          cmake --version

      - name: Build and validate unsigned IPA
        run: ./scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RetroArchTV-mGBA-Multi-unsigned
          path: |
            dist/*.ipa
            dist/SHA256SUMS.txt
            dist/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
